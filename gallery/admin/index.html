<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Sara Kim Gallery</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#0a0a0a;--bg2:#111;--bg3:#161616;--line:#262626;--silver:#cfcfcf;--hi:#f2f2f2;--muted:#8a8a8a;--dim:#5c5c5c;
  --serif:"Bodoni Moda","Didot",Georgia,serif;--sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;--pad:clamp(16px,4vw,48px)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--silver);font-family:var(--sans);font-size:15px;line-height:1.65;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.label{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.16em;color:var(--hi);border:1px solid #3a3a3a;padding:10px 14px;transition:all .2s}
.btn:hover{border-color:var(--hi)}
.btn.solid{background:var(--hi);color:#0a0a0a;border-color:var(--hi)}
.btn:disabled{opacity:.5;cursor:wait}
input,select,textarea{background:var(--bg2);border:1px solid #2e2e2e;padding:10px 12px;border-radius:0;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--silver)}

header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px var(--pad);background:rgba(10,10,10,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .mark{font-family:var(--serif);font-size:18px;color:var(--hi);text-decoration:none}
header .mark i{color:var(--muted)}
main{padding:28px var(--pad) 80px;max-width:1280px;margin:0 auto}

/* login */
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login h1{font-family:var(--serif);font-weight:400;font-size:48px;color:var(--hi);margin:10px 0 26px}
.login form{display:flex;flex-direction:column;gap:10px}
.err{color:#e0a0a0;font-size:14px;min-height:22px}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:22px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stats button{font-size:13px;border:1px solid var(--line);padding:7px 12px;color:var(--muted)}
.stats button.on{border-color:var(--hi);color:var(--hi)}
.stats b{color:var(--hi);font-weight:500;margin-left:4px}
.bar .r{display:flex;gap:8px;align-items:center}
.bar input{width:220px}

/* orders */
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.order{border:1px solid var(--line);margin-bottom:14px;background:var(--bg2)}
.order>summary{list-style:none;display:grid;grid-template-columns:110px 1fr auto auto;gap:16px;align-items:center;padding:16px 18px;cursor:pointer}
.order>summary::-webkit-details-marker{display:none}
.order[open]>summary{border-bottom:1px solid var(--line)}
.oid{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.who b{color:var(--hi);font-weight:500;font-size:16px}
.who span{display:block;font-size:13px;color:var(--muted)}
.amt{font-family:var(--serif);font-size:22px;color:var(--hi);white-space:nowrap}
.st{font-size:12px;padding:5px 10px;border:1px solid #3a3a3a;white-space:nowrap}
.st[data-s="입금 대기"]{border-color:#c9a36a;color:#e3c48f}
.st[data-s="입금 확인"],.st[data-s="제작 중"]{border-color:#7fa8d9;color:#a9c8ee}
.st[data-s="시안 전달"],.st[data-s="배송 중"]{border-color:#a98fd9;color:#c8b6ee}
.st[data-s="완료"]{border-color:#7fc49a;color:#a5dcb9}
.st[data-s="취소"]{color:var(--dim)}
.body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;padding:20px 18px 22px}
dl.info div{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
dl.info dt{color:var(--muted)}
dl.info dd{color:var(--hi);white-space:pre-wrap}
.prompt{margin-top:16px;background:var(--bg);border:1px solid var(--line);padding:14px;white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:var(--hi);max-height:280px;overflow:auto}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.side h4{font-size:12px;letter-spacing:.2em;color:var(--muted);font-weight:400;margin:0 0 8px}
.side section+section{margin-top:20px}
.ph{display:flex;flex-wrap:wrap;gap:8px}
.ph a{display:block;width:110px;height:110px;background:var(--bg3);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .none{font-size:13px;color:var(--dim)}
.up{position:relative;display:inline-flex}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
textarea{min-height:76px;resize:vertical}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--hi);color:#0a0a0a;padding:10px 18px;font-size:14px;z-index:50}
.setup{max-width:640px;margin:10vh auto 0;border:1px solid var(--line);padding:28px;background:var(--bg2)}
.setup h1{font-family:var(--serif);font-weight:400;font-size:34px;color:var(--hi);margin-bottom:12px}
.setup ol{margin:14px 0 0 20px}
.setup li{margin:6px 0}
@media (max-width:820px){
  .order>summary{grid-template-columns:1fr auto;row-gap:6px}
  .order>summary .oid{grid-column:1/-1}
  .body{grid-template-columns:1fr}
  .bar input{width:100%}
  .bar .r{width:100%}
}
</style>
</head>
<body>
<header>
  <a class="mark" href="/gallery/">Sara Kim <i>Gallery</i> · Admin</a>
  <div class="r"><button class="btn" id="refresh" hidden>새로고침</button> <button class="btn" id="logout" hidden>로그아웃</button></div>
</header>
<main>
  <div class="setup" id="needSetup" hidden>
    <p class="label">Setup</p>
    <h1>주문 저장소가 아직 연결되지 않았어요</h1>
    <p>구글 시트와 Apps Script를 설치한 뒤, 배포된 웹 앱 주소를 <code>a/works-gallery.js</code>의 <code>ORDER_API</code>에 넣으면 이 페이지에서 주문을 볼 수 있어요.</p>
  </div>

  <div class="login" id="login" hidden>
    <p class="label">Admin</p>
    <h1>Orders</h1>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="관리자 비밀번호" autocomplete="current-password" required>
      <button class="btn solid" type="submit" style="justify-content:center">들어가기</button>
      <p class="err" id="loginErr"></p>
    </form>
  </div>

  <div id="app" hidden>
    <div class="bar">
      <div class="stats" id="stats"></div>
      <div class="r"><input id="q" type="search" placeholder="이름 · 연락처 · 주문번호 검색"></div>
    </div>
    <div id="list"></div>
  </div>
</main>

<script src="/a/works-gallery.js?v=20261120g"></script>
<script>
(()=>{
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const API=(typeof ORDER_API!=='undefined')?ORDER_API:'';
  let KEY='',DATA=[],STATUSES=[],filter='전체';
  try{KEY=sessionStorage.getItem('skg-admin')||''}catch(_){}

  const toast=t=>{document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)};
  const post=body=>fetch(API,{method:'POST',body:JSON.stringify({...body,key:KEY})}).then(r=>r.json());

  async function load(){
    const r=await fetch(API+'?action=list&key='+encodeURIComponent(KEY)+'&t='+Date.now()).then(r=>r.json());
    if(!r.ok){throw new Error(r.error||'error')}
    DATA=r.orders;STATUSES=r.statuses;render();
  }
  function fmt(t){const d=new Date(t);return isNaN(d)?t:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
  const photos=(arr,empty)=>arr.length?arr.map(p=>`<a href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer"></a>`).join(''):`<span class="none">${empty}</span>`;

  function render(){
    const counts={};DATA.forEach(o=>counts[o.status]=(counts[o.status]||0)+1);
    $('#stats').innerHTML=['전체',...STATUSES].filter(s=>s==='전체'||counts[s]).map(s=>`<button data-f="${esc(s)}" class="${s===filter?'on':''}">${esc(s)}<b>${s==='전체'?DATA.length:counts[s]}</b></button>`).join('');
    const q=$('#q').value.trim().toLowerCase();
    const rows=DATA.filter(o=>(filter==='전체'||o.status===filter)&&(!q||[o.name,o.contact,o.oid,o.addr].join(' ').toLowerCase().includes(q)));
    $('#list').innerHTML=rows.length?rows.map(o=>`
      <details class="order" data-oid="${esc(o.oid)}">
        <summary>
          <span class="oid">${esc(fmt(o.time))}<br>${esc(o.oid)}</span>
          <span class="who"><b>${esc(o.name)}</b><span>${esc(o.product)} · ${esc(o.mode)}</span></span>
          <span class="amt">${esc(o.amount)}</span>
          <span class="st" data-s="${esc(o.status)}">${esc(o.status)}</span>
        </summary>
        <div class="body">
          <div>
            <dl class="info">
              <div><dt>연락처</dt><dd>${esc(o.contact)}</dd></div>
              <div><dt>배송지</dt><dd>${esc(o.addr)}</dd></div>
              <div><dt>누구를 위한</dt><dd>${esc(o.who)}</dd></div>
              <div><dt>스타일</dt><dd>${esc(o.style)}</dd></div>
            </dl>
            <div class="prompt">${esc(o.prompt)}</div>
            <div class="row"><button class="btn" data-copy>프롬프트 복사</button></div>
          </div>
          <div class="side">
            <section><h4>상태</h4>
              <div class="row" style="margin-top:0"><select data-status>${STATUSES.map(s=>`<option${s===o.status?' selected':''}>${esc(s)}</option>`).join('')}</select></div></section>
            <section><h4>손님이 보낸 사진</h4><div class="ph">${photos(o.customerPhotos,'첨부 사진 없음')}</div></section>
            <section><h4>작가 사진 (시안 · 완성작)</h4><div class="ph">${photos(o.artistPhotos,'아직 없음')}</div>
              <div class="row"><label class="btn up">사진 추가<input type="file" accept="image/*" multiple data-add></label></div></section>
            <section><h4>메모</h4><textarea data-memo placeholder="입금 확인, 시안 피드백, 송장번호 등">${esc(o.memo)}</textarea>
              <div class="row"><button class="btn" data-save>메모 저장</button></div></section>
          </div>
        </div>
      </details>`).join(''):`<p class="empty">${DATA.length?'조건에 맞는 주문이 없어요.':'아직 들어온 주문이 없어요.'}</p>`;
  }

  function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const m=2000,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res({name:file.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',data:c.toDataURL('image/jpeg',.9).split(',')[1]})};
    img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}

  $('#list').addEventListener('change',async e=>{
    const card=e.target.closest('.order');if(!card)return;const oid=card.dataset.oid,o=DATA.find(x=>x.oid===oid);
    if(e.target.matches('[data-status]')){const s=e.target.value;const r=await post({action:'update',oid,status:s});
      if(r.ok){o.status=s;card.querySelector('.st').textContent=s;card.querySelector('.st').dataset.s=s;toast('상태를 「'+s+'」로 바꿨어요')}else toast('저장하지 못했어요')}
    if(e.target.matches('[data-add]')){const files=[...e.target.files].slice(0,6);if(!files.length)return;
      const lbl=e.target.parentElement;lbl.firstChild.textContent='올리는 중… ';
      try{const ph=[];for(const f of files)ph.push(await shrink(f));const r=await post({action:'addPhotos',oid,photos:ph});
        if(r.ok){toast('사진 '+r.added+'장을 추가했어요');await load();const c=document.querySelector(`.order[data-oid="${CSS.escape(oid)}"]`);c&&(c.open=true)}else toast('올리지 못했어요')}
      catch(_){toast('올리지 못했어요')}finally{lbl.firstChild.textContent='사진 추가'}}
  });
  $('#list').addEventListener('click',async e=>{
    const card=e.target.closest('.order');if(!card)return;const oid=card.dataset.oid,o=DATA.find(x=>x.oid===oid);
    if(e.target.matches('[data-copy]')){try{await navigator.clipboard.writeText(o.prompt);toast('프롬프트를 복사했어요')}catch(_){}}
    if(e.target.matches('[data-save]')){const m=card.querySelector('[data-memo]').value;const r=await post({action:'update',oid,memo:m});
      if(r.ok){o.memo=m;toast('메모를 저장했어요')}else toast('저장하지 못했어요')}
  });
  $('#stats').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render()}});
  $('#q').addEventListener('input',render);
  $('#refresh').addEventListener('click',()=>load().then(()=>toast('새로 불러왔어요')).catch(()=>toast('불러오지 못했어요')));
  $('#logout').addEventListener('click',()=>{KEY='';try{sessionStorage.removeItem('skg-admin')}catch(_){}show('login')});

  function show(w){$('#needSetup').hidden=w!=='setup';$('#login').hidden=w!=='login';$('#app').hidden=w!=='app';$('#refresh').hidden=$('#logout').hidden=w!=='app';if(w==='login')$('#pw').focus()}
  $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();KEY=$('#pw').value;$('#loginErr').textContent='';
    try{await load();try{sessionStorage.setItem('skg-admin',KEY)}catch(_){}show('app')}
    catch(err){$('#loginErr').textContent=String(err.message)==='auth'?'비밀번호가 맞지 않아요.':'불러오지 못했어요. 잠시 후 다시 해주세요.'}});

  if(!API)show('setup');
  else if(KEY)load().then(()=>show('app')).catch(()=>show('login'));
  else show('login');
})();
</script>
</body>
</html>
